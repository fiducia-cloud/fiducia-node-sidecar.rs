# flags-2-env surface for `fiducia-node-sidecar`
[identity]
service = "fiducia-node-sidecar"
type_name = "SidecarEnv"

[help]
url = "https://github.com/fiducia-node-sidecar"
columns = ["options", "env", "type", "default", "description"]

[parse]
allow_unknown = false

[flags.bind]
env = "FIDUCIA_SIDECAR_BIND"
long = "bind"
type = "string"
default = "127.0.0.1:9090"
help = "HTTP listen address for /healthz /readyz /metrics."

[flags.port]
env = "PORT"
long = "port"
type = "string"
help = "Optional listen port override."

[flags.allow-non-loopback]
env = "ORES_OTEL_SIDECAR_ALLOW_NON_LOOPBACK"
long = "allow-non-loopback"
type = "bool"
default = false
help = "Allow a non-loopback unicast bind address."
